about_page:
  meta_title: 'About — FyraCare Centre'
  meta_description: 'Discover FyraCare, Mauritania’s first multidisciplinary centre dedicated to the needs of pregnant women.'
  eyebrow: 'Welcome to FyraCare'
  title: 'A centre designed for every stage of motherhood.'
  intro: 'Mauritania’s first multidisciplinary centre specifically dedicated to the needs of pregnant women.'
  image_alt: 'FyraCare Centre reception in Nouakchott'
  aside: 'Before, during and after birth'
  paragraph_one: 'Pregnancy can bring emotional, psychological and social changes. Preparing for motherhood and a new baby also raises many questions and can create stress for some women.'
  paragraph_two: 'Led by an experienced midwife, FyraCare supports you with kindness and dedication before, during and after birth. The centre offers intellectual, emotional and physical birth preparation, perineal preparation, postpartum pelvic-floor rehabilitation and breastfeeding consultations.'
  point_one: 'Birth preparation'
  point_two: 'Pelvic health and postpartum'
  point_three: 'Breastfeeding consultations'
  cta_eyebrow: 'Your FyraCare journey'
  cta_title: 'Discover support tailored to your needs.'

expertise_page:
  meta_title: 'Our expertise — Aminata Boulkheir Diarra'
  meta_description: 'Discover the experience of Aminata Boulkheir Diarra, midwife and founder of the FyraCare Centre.'
  eyebrow: 'Aminata Boulkheir Diarra'
  title: 'Committed expertise dedicated to women.'
  intro: 'A midwife specialising in birth preparation, pelvic-floor rehabilitation, massage and wellbeing.'
  aside: 'Founder of the FyraCare Multidisciplinary Centre'
  paragraph_one: 'After developing expertise in traditional Damp massage in Mali and refining my skills in Cotonou, Benin, I am proud to welcome you to the first centre of its kind in Mauritania, dedicated to women’s specific needs, especially during pregnancy.'
  paragraph_two: 'Together with a dedicated team, I am committed to offering quality care in a warm and attentive environment. We support you before, during and after birth, with your comfort and wellbeing at the centre of every stage.'
  paragraph_three: 'At FyraCare, we believe in a comprehensive approach to women’s health. Love, listening and support are at the heart of everything we do.'
  skills_eyebrow: 'Qualifications & expertise'
  skills_title: 'A complete approach combining expertise and education.'
