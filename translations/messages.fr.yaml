about_page:
  meta_title: 'À propos — Centre FyraCare'
  meta_description: 'Découvrez FyraCare, premier centre multidisciplinaire en Mauritanie consacré aux besoins de la femme enceinte.'
  eyebrow: 'Bienvenue à FyraCare'
  title: 'Un centre pensé pour chaque étape de la maternité.'
  intro: 'Le premier centre multidisciplinaire en Mauritanie spécialement consacré aux besoins de la femme enceinte.'
  image_alt: 'Accueil du Centre FyraCare à Nouakchott'
  aside: 'Avant, pendant et après la naissance'
  paragraph_one: 'Être enceinte peut entraîner des changements émotionnels, psychologiques et sociaux. Se préparer à la maternité et à l’arrivée d’un bébé suscite aussi de nombreuses questions et peut être une source de stress pour certaines femmes.'
  paragraph_two: 'Géré par une sage-femme expérimentée, le Centre FyraCare vous accompagne avec amabilité et dévouement avant, pendant et après l’accouchement. Vous y trouverez des cours de préparation intellectuelle, émotionnelle et physique à la naissance, la préparation du périnée à l’accouchement, la rééducation périnéale post-partum ainsi que des consultations en allaitement.'
  point_one: 'Préparation à la naissance'
  point_two: 'Périnée et post-partum'
  point_three: 'Consultations en allaitement'
  cta_eyebrow: 'Votre parcours FyraCare'
  cta_title: 'Découvrez un accompagnement adapté à vos besoins.'

expertise_page:
  meta_title: 'Notre expertise — Aminata Boulkheir Diarra'
  meta_description: 'Découvrez le parcours et l’expertise d’Aminata Boulkheir Diarra, sage-femme et fondatrice du Centre FyraCare.'
  eyebrow: 'Aminata Boulkheir Diarra'
  title: 'Une expertise engagée au service des femmes.'
  intro: 'Sage-femme spécialisée dans la préparation à la naissance, la rééducation du périnée, le massage et le bien-être.'
  aside: 'Fondatrice du Centre Multidisciplinaire FyraCare'
  paragraph_one: 'Ayant acquis une expertise en Damp, massage traditionnel, au Mali et perfectionné mes compétences à Cotonou, au Bénin, je suis fière de vous accueillir dans notre centre, le premier du genre en Mauritanie, dédié aux besoins spécifiques de la femme, notamment de la femme enceinte.'
  paragraph_two: 'En collaboration avec une équipe dévouée, je m’engage à vous offrir des soins de qualité dans un environnement chaleureux et attentionné. Notre objectif est de vous accompagner avant, pendant et après l’accouchement, en mettant l’accent sur votre bien-être et votre confort à chaque étape de votre maternité.'
  paragraph_three: 'Au Centre Multidisciplinaire FyraCare, nous croyons en l’importance d’une approche globale de la santé de la femme. L’amour, l’écoute et le soutien sont au cœur de chaque accompagnement.'
