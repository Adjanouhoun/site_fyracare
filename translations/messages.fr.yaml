  filter_label: 'Rechercher une prestation'
  filter_placeholder: 'Massage, naissance, post-partum…'
  no_results: 'Aucune prestation ne correspond à votre recherche.'
  catalog:
    pelvic_rehab: { title: 'Rééducation périnéale et abdominale', short: 'Récupération et santé pelvienne', text: 'Vous avez accouché enfin, et nous avons parlé plusieurs fois durant nos cours de préparation à la naissance, sur l’importance de ce périnée, qui assure non seulement le rôle de reproduction, mais aussi un rôle dans la sexualité et la confiance en soi. La rééducation périnéale aura comme principal but de redonner du tonus à ces muscles du périnée, pour qu’ils continuent d’assurer au mieux leur rôle de soutien et de continence. D’autres symptômes peuvent également être traités : comme les tensions, les douleurs, l’incontinence urinaire, la sensation de pesanteur pelvienne. On devrait entamer la rééducation périnéale et ensuite faire une rééducation abdominale et jamais l’inverse. La rééducation périnéale et abdominale peut se faire après une césarienne aussi. Les cours commencent 6 à 8 semaines après l’accouchement.' }
    birth_support: { title: 'Accompagnement à la Naissance', short: 'Présence le jour de la naissance', text: 'Je vous accompagne le jour de votre accouchement afin de vous aider à mettre au monde votre bout de choux. Si vous avez déjà suivi les cours de préparation à la naissance, je serai présente pour les appliquer. Je vous aide à surmonter la douleur, à gérer le stress et à mettre en œuvre toutes les postures qui vont vous aider à accoucher dans les meilleures conditions.' }
    rebozo: { title: 'Closing of the Bones', short: 'Soin traditionnel post-partum', text: 'Le soin Rebozo est un soin traditionnel ancestral mexicain réalisé à l’aide d’un châle léger en coton : le rebozo. Il s’agit d’une technique de relaxation pratiquée aux jeunes mamans, qui dure environ 4 heures. Il se compose d’un massage aux huiles essentielles, d’un bain à vapeur aux plantes et d’un resserrage profond du corps avec le Rebozo. Massage à 4 mains, le soin Rebozo est effectué par deux femmes, 40 jours au moins après un accouchement.' }
    damp: { title: 'Damp traditional pour les femmes en post nuptials, partum, ou abortum', short: 'Remise en forme naturelle', text: 'Le programme damp est conçu avec différentes techniques et savoir-faire ancestral naturel qui va au-delà de la peau. C’est une remise en forme qui vise les muscles pour une régénération du corps et une bonne vascularisation. Après 9 mois de grossesse et le labeur de l’accouchement, nous vous proposons le pack post-partum conçu pour accompagner les femmes dans leur période de récupération après la grossesse et l’accouchement.' }
    breastfeeding: { title: 'Consultation en Allaitement', short: 'Conseils mère et bébé', text: 'Une consultation en allaitement débute toujours par un entretien entre vous et la consultante en lactation. L’entretien lui permet de bien comprendre votre projet d’allaitement. C’est aussi l’occasion d’évaluer votre état de santé ainsi que la relation que vous entretenez avec votre bébé, afin de vous proposer l’accompagnement le plus adapté. Si vous rencontrez des difficultés lors des tétées, une tétée pourra être observée afin d’identifier l’origine de vos problèmes et de définir un plan d’action approprié.' }
    perineum: { title: 'Préparation du Périnée', short: 'Souplesse et prévention', text: 'Le massage du périnée est fortement recommandé par le centre FyraCare ainsi que par plusieurs sages-femmes, notamment lors des cours de préparation à l’accouchement. Effectué avec les doigts, ce massage très doux peut aider à détendre la zone périnéale afin d’éviter les déchirures et l’épisiotomie. FyraCare propose cette technique en une seule séance pour apprendre l’auto-massage à domicile, ou dans un pack de 5 ou 10 séances.' }
    birth_prep: { title: 'Préparation à la naissance', short: 'Séances théoriques et pratiques', text: 'La préparation à la naissance consiste en une formation théorique et pratique sur le déroulement de la grossesse, de l’accouchement et des premiers jours qui s’en suivent. Elle comprend plusieurs séances aux thématiques différentes pour vous préparer physiquement et psychologiquement à l’arrivée de votre bébé : gestion du stress et de la douleur, respiration, positionnement du bébé dans le bassin, techniques de poussée, postures d’accouchement, allaitement maternel et quatrième trimestre.' }
    prenatal_massage: { title: 'Massage Prénatal', short: 'Détente pendant la grossesse', text: 'Le massage prénatal est un massage thérapeutique qui stimule la fonction des muscles et des articulations, améliore la circulation et la santé générale du corps, et soulage la fatigue mentale et physique. Spécialement conçu pour accompagner la femme enceinte à partir du 4ème mois de grossesse, il offre un moment de détente et de réconfort pour la maman et le bébé, tout en soulageant les tensions et fatigues musculaires.' }
